server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Security headers (los que antes ponía vercel.json en el frontend).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash: cache agresiva e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Detrás de Traefik (TLS terminado fuera) nginx solo ve http, así que un
    # redirect absoluto saldría como http:// y forzaría un doble salto.
    # Con esto el Location es relativo y el 301 resuelve en un solo salto https.
    absolute_redirect off;

    # SEO: post antiguo consolidado en la guía pilar de pike push ups.
    # 301 para que Google transfiera las señales a la página que sí rankea.
    location = /es/blog/rutina-pike-pushups {
        return 301 /es/blog/pike-push-ups-guia-definitiva;
    }
    location = /en/blog/rutina-pike-pushups {
        return 301 /en/blog/pike-push-ups-ultimate-guide;
    }
    location = /blog/rutina-pike-pushups {
        return 301 /es/blog/pike-push-ups-guia-definitiva;
    }

    # URL huérfana que Google llegó a indexar (BlogView renderizaba un
    # fallback para slugs inexistentes) → 301 a la guía real.
    location = /es/blog/Manual {
        return 301 /es/blog/manual-inicio-calistenia;
    }
    location = /en/blog/Manual {
        return 301 /en/blog/calisthenics-beginner-manual;
    }


    # SEO: el blog ahora usa slug por idioma. Las URLs /en/blog/<slug-es>
    # antiguas hacen 301 al slug EN (generado desde blogData.json slugEn).
    location = /en/blog/ayuno-intermitente-calistenia { return 301 /en/blog/intermittent-fasting-calisthenics; }
    location = /en/blog/beneficios-de-colgarse { return 301 /en/blog/dead-hang-benefits; }
    location = /en/blog/calistenia-despues-de-los-40 { return 301 /en/blog/calisthenics-after-40; }
    location = /en/blog/calistenia-en-casa-sin-equipo { return 301 /en/blog/home-calisthenics-no-equipment; }
    location = /en/blog/calistenia-viajando-sin-gym { return 301 /en/blog/calisthenics-while-traveling; }
    location = /en/blog/calistenia-vs-pesas { return 301 /en/blog/calisthenics-vs-weights; }
    location = /en/blog/calistenia-y-correr { return 301 /en/blog/calisthenics-and-running; }
    location = /en/blog/como-dormir-para-progresar { return 301 /en/blog/sleep-for-gains; }
    location = /en/blog/descanso-entre-series { return 301 /en/blog/rest-between-sets; }
    location = /en/blog/dolor-antebrazo-codo-dominadas { return 301 /en/blog/forearm-elbow-pain-pull-ups; }
    location = /en/blog/dolor-codo-dominadas { return 301 /en/blog/elbow-pain-pull-ups; }
    location = /en/blog/ejercicios-hombros-calistenia { return 301 /en/blog/calisthenics-shoulder-exercises; }
    location = /en/blog/entrenar-con-frio-calistenia { return 301 /en/blog/training-in-cold-weather; }
    location = /en/blog/error-mas-dominadas { return 301 /en/blog/more-pull-ups-mistake; }
    location = /en/blog/errores-comunes-principiantes { return 301 /en/blog/common-beginner-mistakes; }
    location = /en/blog/flexiones-hombro-pike-pushups { return 301 /en/blog/shoulder-push-ups-handstand-path; }
    location = /en/blog/flexiones-perfectas-errores { return 301 /en/blog/perfect-push-ups-mistakes; }
    location = /en/blog/fondos-paralelas-guia { return 301 /en/blog/parallel-bar-dips-guide; }
    location = /en/blog/front-lever-guia-fuerza { return 301 /en/blog/front-lever-strength-guide; }
    location = /en/blog/gamificacion-fitness-ciencia { return 301 /en/blog/fitness-gamification-science; }
    location = /en/blog/grease-the-groove-mas-dominadas { return 301 /en/blog/grease-the-groove-more-pull-ups; }
    location = /en/blog/guia-definitiva-dominadas { return 301 /en/blog/ultimate-pull-up-guide; }
    location = /en/blog/guia-recompensas-cofres-bosses { return 301 /en/blog/chests-bosses-rewards-guide; }
    location = /en/blog/hollow-body-core-maestro { return 301 /en/blog/hollow-body-core-mastery; }
    location = /en/blog/lanzamiento-oficial-reppy-rpg { return 301 /en/blog/reppy-rpg-official-launch; }
    location = /en/blog/manual-inicio-calistenia { return 301 /en/blog/calisthenics-beginner-manual; }
    location = /en/blog/mejor-hora-para-entrenar { return 301 /en/blog/best-time-to-train; }
    location = /en/blog/muscle-up-progresion-tecnica { return 301 /en/blog/muscle-up-progression-technique; }
    location = /en/blog/nutricion-calistenia { return 301 /en/blog/calisthenics-nutrition; }
    location = /en/blog/nutricion-calistenia-proteina { return 301 /en/blog/calisthenics-protein-nutrition; }
    location = /en/blog/orden-aprender-trucos { return 301 /en/blog/skill-learning-order; }
    location = /en/blog/overhaul-avatares-rpg-2026 { return 301 /en/blog/rpg-avatars-overhaul-2026; }
    location = /en/blog/pike-push-ups-guia-definitiva { return 301 /en/blog/pike-push-ups-ultimate-guide; }
    location = /en/blog/plancha-abdominal-errores { return 301 /en/blog/plank-mistakes; }
    location = /en/blog/prevencion-lesiones-muneca { return 301 /en/blog/wrist-injury-prevention; }
    location = /en/blog/programa-dominadas-8-semanas { return 301 /en/blog/8-week-pull-up-program; }
    location = /en/blog/progresion-fondos-paralelas { return 301 /en/blog/dips-progression; }
    location = /en/blog/psicologia-del-muscle-up { return 301 /en/blog/muscle-up-psychology; }
    location = /en/blog/rutina-calistenia-semanal-principiantes { return 301 /en/blog/beginner-weekly-calisthenics-routine; }
    location = /en/blog/sentadilla-pistol-guia-piernas { return 301 /en/blog/pistol-squat-guide; }
    location = /en/blog/sentadillas-potencia-pierna { return 301 /en/blog/squats-leg-power; }
    location = /en/blog/suplementos-que-valen-la-pena { return 301 /en/blog/supplements-worth-taking; }
    location = /en/blog/verdad-sobre-el-fallo { return 301 /en/blog/truth-about-training-to-failure; }

    # vite-ssg pre-renderiza rutas a .html; el fallback a index.html cubre
    # las rutas dinámicas (SPA) que no tienen HTML pre-generado.
    # OJO: no incluir $uri/ — con directorios sin index provoca 403 en vez de
    # caer al fallback SPA (rompía el F5 en rutas como /es/dashboard).
    location / {
        try_files $uri $uri.html /index.html;
    }
}
