# Idioma de destino del 301 de la raíz. Espeja la detección que hacía el
# router en cliente (stores/i18n.js: navegador en inglés → /en), pero el
# DEFECTO es `es` — así los crawlers (que no mandan Accept-Language) y el
# tráfico hispano caen en /es, el idioma principal del proyecto.
map $http_accept_language $reppy_root_locale {
    default   es;
    ~*^en     en;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Security headers (los que antes ponía vercel.json en el frontend).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash: cache agresiva e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Detrás de Traefik (TLS terminado fuera) nginx solo ve http, así que un
    # redirect absoluto saldría como http:// y forzaría un doble salto.
    # Con esto el Location es relativo y el 301 resuelve en un solo salto https.
    absolute_redirect off;

    # SEO: la raíz devolvía 200 con el contenido de /es y un canonical a /es
    # (duplicado blando que Google tiene que resolver por su cuenta). Ahora es
    # un 301 real. Match exacto: NO afecta a /join, /es/*, /en/* ni al fallback
    # SPA de `try_files … /index.html` (redirección interna a /index.html, que
    # matchea `location /`, no `location = /`).
    # `$is_args$args` es obligatorio: al llevar el destino una variable, nginx
    # NO reengancha la query string por su cuenta (verificado) y se perderían
    # las UTM de las campañas que apuntan a la raíz.
    location = / {
        add_header Vary "Accept-Language" always;
        return 301 /$reppy_root_locale$is_args$args;
    }

    # SEO: post antiguo consolidado en la guía pilar de pike push ups.
    # 301 para que Google transfiera las señales a la página que sí rankea.
    location = /es/blog/rutina-pike-pushups {
        return 301 /es/blog/pike-push-ups-guia-definitiva;
    }
    location = /en/blog/rutina-pike-pushups {
        return 301 /en/blog/pike-push-ups-ultimate-guide;
    }
    location = /blog/rutina-pike-pushups {
        return 301 /es/blog/pike-push-ups-guia-definitiva;
    }

    # SEO: `dolor-codo-dominadas` (282 palabras) canibalizaba la keyword
    # "dolor codo dominadas" con el pilar `dolor-antebrazo-codo-dominadas`
    # (~1.9k palabras): la keyword estaba literalmente en el array `keywords`
    # de los DOS. Consolidado en el pilar — lo útil del corto (anillas, agarre,
    # pulgar fuera) ya está incorporado allí — y el post retirado del dataset,
    # así que estas rutas ya no las sirve el SSG y necesitan el 301 explícito.
    location = /es/blog/dolor-codo-dominadas {
        return 301 /es/blog/dolor-antebrazo-codo-dominadas;
    }
    location = /en/blog/elbow-pain-pull-ups {
        return 301 /en/blog/forearm-elbow-pain-pull-ups;
    }
    location = /blog/dolor-codo-dominadas {
        return 301 /es/blog/dolor-antebrazo-codo-dominadas;
    }

    # URL huérfana que Google llegó a indexar (BlogView renderizaba un
    # fallback para slugs inexistentes) → 301 a la guía real.
    location = /es/blog/Manual {
        return 301 /es/blog/manual-inicio-calistenia;
    }
    location = /en/blog/Manual {
        return 301 /en/blog/calisthenics-beginner-manual;
    }


    # SEO: el blog ahora usa slug por idioma. Las URLs /en/blog/<slug-es>
    # antiguas hacen 301 al slug EN (generado desde blogData.json slugEn).
    location = /en/blog/ayuno-intermitente-calistenia { return 301 /en/blog/intermittent-fasting-calisthenics; }
    location = /en/blog/beneficios-de-colgarse { return 301 /en/blog/dead-hang-benefits; }
    location = /en/blog/calistenia-despues-de-los-40 { return 301 /en/blog/calisthenics-after-40; }
    location = /en/blog/calistenia-en-casa-sin-equipo { return 301 /en/blog/home-calisthenics-no-equipment; }
    location = /en/blog/calistenia-viajando-sin-gym { return 301 /en/blog/calisthenics-while-traveling; }
    location = /en/blog/calistenia-vs-pesas { return 301 /en/blog/calisthenics-vs-weights; }
    location = /en/blog/calistenia-y-correr { return 301 /en/blog/calisthenics-and-running; }
    location = /en/blog/como-dormir-para-progresar { return 301 /en/blog/sleep-for-gains; }
    location = /en/blog/descanso-entre-series { return 301 /en/blog/rest-between-sets; }
    location = /en/blog/dolor-antebrazo-codo-dominadas { return 301 /en/blog/forearm-elbow-pain-pull-ups; }
    # Apunta al pilar, no al slug EN del post consolidado: si no, esta URL haría
    # una cadena de dos 301 (slug-es → elbow-pain → forearm-elbow-pain).
    location = /en/blog/dolor-codo-dominadas { return 301 /en/blog/forearm-elbow-pain-pull-ups; }
    location = /en/blog/ejercicios-hombros-calistenia { return 301 /en/blog/calisthenics-shoulder-exercises; }
    location = /en/blog/entrenar-con-frio-calistenia { return 301 /en/blog/training-in-cold-weather; }
    location = /en/blog/error-mas-dominadas { return 301 /en/blog/more-pull-ups-mistake; }
    location = /en/blog/errores-comunes-principiantes { return 301 /en/blog/common-beginner-mistakes; }
    location = /en/blog/flexiones-hombro-pike-pushups { return 301 /en/blog/shoulder-push-ups-handstand-path; }
    location = /en/blog/flexiones-perfectas-errores { return 301 /en/blog/perfect-push-ups-mistakes; }
    location = /en/blog/fondos-paralelas-guia { return 301 /en/blog/parallel-bar-dips-guide; }
    location = /en/blog/front-lever-guia-fuerza { return 301 /en/blog/front-lever-strength-guide; }
    location = /en/blog/gamificacion-fitness-ciencia { return 301 /en/blog/fitness-gamification-science; }
    location = /en/blog/grease-the-groove-mas-dominadas { return 301 /en/blog/grease-the-groove-more-pull-ups; }
    location = /en/blog/guia-definitiva-dominadas { return 301 /en/blog/ultimate-pull-up-guide; }
    location = /en/blog/guia-recompensas-cofres-bosses { return 301 /en/blog/chests-bosses-rewards-guide; }
    location = /en/blog/hollow-body-core-maestro { return 301 /en/blog/hollow-body-core-mastery; }
    location = /en/blog/lanzamiento-oficial-reppy-rpg { return 301 /en/blog/reppy-rpg-official-launch; }
    location = /en/blog/manual-inicio-calistenia { return 301 /en/blog/calisthenics-beginner-manual; }
    location = /en/blog/mejor-hora-para-entrenar { return 301 /en/blog/best-time-to-train; }
    location = /en/blog/muscle-up-progresion-tecnica { return 301 /en/blog/muscle-up-progression-technique; }
    location = /en/blog/nutricion-calistenia { return 301 /en/blog/calisthenics-nutrition; }
    location = /en/blog/nutricion-calistenia-proteina { return 301 /en/blog/calisthenics-protein-nutrition; }
    location = /en/blog/orden-aprender-trucos { return 301 /en/blog/skill-learning-order; }
    location = /en/blog/overhaul-avatares-rpg-2026 { return 301 /en/blog/rpg-avatars-overhaul-2026; }
    location = /en/blog/pike-push-ups-guia-definitiva { return 301 /en/blog/pike-push-ups-ultimate-guide; }
    location = /en/blog/plancha-abdominal-errores { return 301 /en/blog/plank-mistakes; }
    location = /en/blog/prevencion-lesiones-muneca { return 301 /en/blog/wrist-injury-prevention; }
    location = /en/blog/programa-dominadas-8-semanas { return 301 /en/blog/8-week-pull-up-program; }
    location = /en/blog/progresion-fondos-paralelas { return 301 /en/blog/dips-progression; }
    location = /en/blog/psicologia-del-muscle-up { return 301 /en/blog/muscle-up-psychology; }
    location = /en/blog/rutina-calistenia-semanal-principiantes { return 301 /en/blog/beginner-weekly-calisthenics-routine; }
    location = /en/blog/sentadilla-pistol-guia-piernas { return 301 /en/blog/pistol-squat-guide; }
    location = /en/blog/sentadillas-potencia-pierna { return 301 /en/blog/squats-leg-power; }
    location = /en/blog/suplementos-que-valen-la-pena { return 301 /en/blog/supplements-worth-taking; }
    location = /en/blog/verdad-sobre-el-fallo { return 301 /en/blog/truth-about-training-to-failure; }

    # SEO: las landings tienen slug por idioma (router.js: path ES + alias EN),
    # pero el router acepta los dos slugs en los dos idiomas. Sin estos 301,
    # /en/contador-dominadas devolvía 200 con la home ES (soft 404 que Google
    # tenía en "Rastreada: actualmente sin indexar").
    location = /en/contador-dominadas { return 301 /en/pull-up-counter$is_args$args; }
    location = /en/contador-flexiones { return 301 /en/push-up-counter$is_args$args; }
    location = /en/app-calistenia { return 301 /en/calisthenics-app$is_args$args; }
    location = /en/app-dominadas { return 301 /en/pull-up-app$is_args$args; }
    location = /en/app-flexiones { return 301 /en/push-up-app$is_args$args; }
    location = /en/app-fondos { return 301 /en/dips-app$is_args$args; }
    location = /en/contador-fondos { return 301 /en/dips-counter$is_args$args; }
    location = /en/contador-muscle-ups { return 301 /en/muscle-up-counter$is_args$args; }
    location = /en/contador-dominadas-supinas { return 301 /en/chin-up-counter$is_args$args; }
    location = /en/reto-calistenia-30-dias { return 301 /en/30-day-calisthenics-challenge$is_args$args; }
    location = /en/reppy-vs-otras-apps-calistenia { return 301 /en/reppy-vs-calisthenics-apps$is_args$args; }
    location = /es/pull-up-counter { return 301 /es/contador-dominadas$is_args$args; }
    location = /es/push-up-counter { return 301 /es/contador-flexiones$is_args$args; }
    location = /es/calisthenics-app { return 301 /es/app-calistenia$is_args$args; }
    location = /es/pull-up-app { return 301 /es/app-dominadas$is_args$args; }
    location = /es/push-up-app { return 301 /es/app-flexiones$is_args$args; }
    location = /es/dips-app { return 301 /es/app-fondos$is_args$args; }
    location = /es/dips-counter { return 301 /es/contador-fondos$is_args$args; }
    location = /es/muscle-up-counter { return 301 /es/contador-muscle-ups$is_args$args; }
    location = /es/chin-up-counter { return 301 /es/contador-dominadas-supinas$is_args$args; }
    location = /es/30-day-calisthenics-challenge { return 301 /es/reto-calistenia-30-dias$is_args$args; }
    location = /es/reppy-vs-calisthenics-apps { return 301 /es/reppy-vs-otras-apps-calistenia$is_args$args; }
    # Solo existe en inglés.
    location = /es/free-rpg-pull-up-counter { return 301 /en/free-rpg-pull-up-counter$is_args$args; }

    # Perfiles públicos: /es/atleta/* y /en/athlete/* (alias cruzados → 301).
    location ~ ^/es/athlete/([^/]+)$ { return 301 /es/atleta/$1$is_args$args; }
    location ~ ^/en/atleta/([^/]+)$ { return 301 /en/athlete/$1$is_args$args; }

    # Barra final: /es/contador-dominadas/ → sin barra (si no, sería 404).
    location ~ ^(/.+)/$ { return 301 $1$is_args$args; }

    # Rutas dinámicas de la SPA: pueden no tener HTML pre-generado (app con
    # login, perfiles fuera del top que se pre-renderiza, rutas sin locale que
    # el router redirige en cliente), así que caen al fallback index.html.
    # Mantener en sync con las rutas de router.js (y knownPaths del guard).
    # OJO: no incluir $uri/ — con directorios sin index provoca 403 en vez de
    # caer al fallback SPA (rompía el F5 en rutas como /es/dashboard).
    location ~ ^/(es|en)/(login|dashboard|batalla|campana|social|shop|codex|inventory|profile|admin|notifications|pvp|missions)(/.*)?$ {
        try_files $uri $uri.html /index.html;
    }
    location ~ ^/(es/atleta|en/athlete)/[^/]+$ {
        try_files $uri $uri.html /index.html;
    }
    location ~ ^/(join|dashboard|social|shop|codex|inventory|profile|admin|notifications|blog|login|missions|contador-dominadas|contador-flexiones|app-calistenia|app-dominadas|app-flexiones|app-fondos|contador-fondos|contador-muscle-ups|contador-dominadas-supinas|reto-calistenia-30-dias|reppy-vs-otras-apps-calistenia|free-rpg-pull-up-counter)(/.*)?$ {
        try_files $uri $uri.html /index.html;
    }

    # Todo lo demás: fichero estático o página pre-renderizada por vite-ssg, y
    # si no existe, 404 REAL. Antes caía a index.html con 200 (la home ES con
    # canonical a /es): cualquier URL inventada o slug de blog inexistente era
    # un duplicado de la home — soft 404 que gasta rastreo (Bing: "limited
    # crawl capacity") y ensucia "Rastreada: actualmente sin indexar".
    # El cuerpo sigue siendo la SPA, que en cliente pinta la vista NotFound.
    location / {
        try_files $uri $uri.html =404;
        error_page 404 /index.html;
    }
}
