server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Assets con hash: cache agresiva e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # vite-ssg pre-renderiza rutas a .html; el fallback a index.html cubre
    # las rutas dinámicas (SPA) que no tienen HTML pre-generado.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
